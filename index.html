<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Image operations</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">
    <canvas id="displayCanvas" aria-label="Processed image display"></canvas>

    <section class="file-controls" aria-label="Source image selection">
      <label class="file-control" for="file1">
        <span class="file-label">Image 1:</span>
        <span class="file-name" id="fileName1">1.png</span>
        <input id="file1" type="file" accept="image/*">
      </label>

      <label class="file-control" for="file2">
        <span class="file-label">Image 2:</span>
        <span class="file-name" id="fileName2">2.png</span>
        <input id="file2" type="file" accept="image/*">
      </label>

      <label class="file-control" for="file3">
        <span class="file-label">Image 3:</span>
        <span class="file-name" id="fileName3">3.png</span>
        <input id="file3" type="file" accept="image/*">
      </label>
    </section>

    <section class="sonification-controls" aria-label="Image sonification controls">
      <button id="playSonificationButton" class="sonification-button" type="button" aria-pressed="false">Play sonification</button>
      <div id="sonificationStatus" class="sonification-status" aria-live="polite">Select an image or operation</div>
    </section>

    <aside class="right-panel">
      <nav id="operationButtons" class="operation-buttons" aria-label="Image operations"></nav>

      <section id="formulaPanel" class="formula-panel" aria-live="polite">
        <h2 id="formulaTitle">No operation selected</h2>
        <pre id="formulaText">Loading default images...</pre>
      </section>
    </aside>

    <div id="emptyMessage" class="empty-message">
      <strong>Select Image 1, Image 2 and Image 3</strong>
      <span>Images are scaled to cover the window without stretching.</span>
    </div>

    <section class="sound-controls" aria-label="Sound controls">
      <label class="frequency-control" for="frequency1">
        <span>Frequency 1</span>
        <select id="frequency1" aria-label="Frequency 1"></select>
      </label>
      <label class="frequency-control" for="frequency2">
        <span>Frequency 2</span>
        <select id="frequency2" aria-label="Frequency 2"></select>
      </label>
      <label class="frequency-control" for="frequency3">
        <span>Frequency 3</span>
        <select id="frequency3" aria-label="Frequency 3"></select>
      </label>
      <button id="playSoundButton" class="sound-button" type="button" aria-pressed="false">Play sound</button>
    </section>
    <div id="busyIndicator" class="busy-indicator" hidden>Processing...</div>
  </main>

  <script src="functions.js"></script>
  <script src="sound.js"></script>
  <script src="sonification.js"></script>
</body>
</html>
